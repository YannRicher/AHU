name: Update catalog

# Verifie les nouvelles versions des applications en mode Auto, met a jour leurs manifestes,
# regenere catalog/apps.json et ouvre une pull request par nouvelle version.
# Fusionner la PR = publier la version aux postes. La fermer sans fusionner = refuser cette version.

on:
  schedule:
    - cron: '0 10 * * *' # tous les jours vers 5 h / 6 h (heure de Montreal)
  workflow_dispatch:
    inputs:
      app:
        description: "Id d'une application (vide = toutes les applications Auto)"
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: catalog-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@v4

      - id: list
        shell: pwsh
        env:
          APP_ID: ${{ inputs.app }}
        run: ./automation/Get-UpdatableApp.ps1 -AppId $env:APP_ID

  update:
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      - id: update
        shell: pwsh
        env:
          APP_ID: ${{ matrix.app }}
        run: ./automation/Update-AppManifest.ps1 -AppId $env:APP_ID

      - if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.app }}
          path: ${{ steps.update.outputs.manifest }}
          retention-days: 5

  publish:
    needs: [discover, update]
    if: always() && needs.discover.result == 'success' && needs.discover.outputs.apps != '[]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recuperer les manifestes modifies
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: manifest-*
          path: catalog/applications
          merge-multiple: true

      - name: Generer et valider le catalogue
        shell: pwsh
        run: |
          ./automation/Build-Catalog.ps1
          ./automation/Test-Catalog.ps1

      # Les PR creees par GITHUB_TOKEN ne declenchent pas Validate.yml: les tests tournent donc ici.
      - name: Tests Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: Preparer la branche
        id: branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add catalog
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Aucune nouvelle version.'
            exit 0
          }

          $files = @(git diff --cached --name-only -- catalog/applications)
          $entries = foreach ($file in $files) {
            $m = Get-Content -Raw -LiteralPath $file | ConvertFrom-Json
            [pscustomobject]@{ Id = $m.Id; Version = $m.Version; Url = $m.DownloadUrl }
          }
          $key = (@($entries | ForEach-Object { '{0}-{1}' -f $_.Id, $_.Version })) -join '_'
          $branch = 'catalog/' + ($key.ToLowerInvariant() -replace '[^a-z0-9._-]', '-')

          # Une version deja proposee (PR ouverte, fusionnee ou refusee) n'est pas reproposee.
          $existing = [int](gh pr list --head $branch --state all --json number --jq 'length')
          if ($existing -gt 0) {
            Write-Host ('PR deja existante pour {0}, aucune nouvelle PR.' -f $branch)
            exit 0
          }

          git checkout -b $branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m ('catalog: {0}' -f $key)
          git push -u origin $branch
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "branch=$branch"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'changed=true'

      - name: Ouvrir la pull request
        if: steps.branch.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          $sha = git rev-parse HEAD
          $entries = @()
          foreach ($file in @(git show --name-only --format= HEAD -- catalog/applications)) {
            if (-not $file) { continue }
            $m = Get-Content -Raw -LiteralPath $file | ConvertFrom-Json
            $entries += [pscustomobject]@{ Id = $m.Id; Version = $m.Version; Url = $m.DownloadUrl }
          }

          $title = 'Publier : ' + (($entries | ForEach-Object { '{0} {1}' -f $_.Id, $_.Version }) -join ', ')
          $lines = @('Nouvelle version detectee par GitHub Actions.', '')
          foreach ($e in $entries) { $lines += ('- **{0}** : version {1} ({2})' -f $e.Id, $e.Version, $e.Url) }
          $lines += ''
          $lines += ('Commit : https://github.com/{0}/commit/{1}' -f $env:GITHUB_REPOSITORY, $sha)
          $lines += ''
          $lines += '**Fusionner cette PR** pour publier la version. Les postes l''appliquent au prochain cycle Intune, si la remediation est active.'
          $lines += '**Fermer cette PR sans fusionner** pour refuser cette version: elle ne sera plus reproposee.'
          Set-Content -LiteralPath body.md -Value ($lines -join "`n") -Encoding utf8

          gh pr create --base main --head $env:BRANCH --title $title --body-file body.md --assignee $env:OWNER
